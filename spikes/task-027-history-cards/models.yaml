# TASK-027's models: gemma4:31b, ministral-14b and gemini-3.5-flash-lite,
# as SPIKE-028's file has them. Keys come from ../../.env; no reserve
# keys. Gemini is capped by -gemini-cap a Pacific day.
providers:
  - name: gemini
    kind: gemini
    key_env: GEMINI_API_KEY
    models:
      - {id: gemini-3.5-flash-lite, context: 1048576}
  - name: ollama-cloud
    kind: ollama
    base_url: https://ollama.com/
    key_env: OLLAMA_API_KEY
    models:
      - {id: gemma4:31b, context: 262144}
  - name: mistral
    kind: openai_compatible
    base_url: https://api.mistral.ai/v1/
    key_env: MISTRAL_API_KEY
    models:
      - {id: ministral-14b-latest, context: 131072}
