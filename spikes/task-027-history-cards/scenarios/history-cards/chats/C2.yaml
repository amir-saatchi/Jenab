# C2, a job search (English). 22 earlier turns; the follow-up is turn 23.
#   turn 3:  job_scan_go, the follow-up C2_repeat needs (weekdays, the
#            70,000 EUR floor, job_posts)
#   turn 8:  stale_apps, the follow-up C2_para needs (14 days, oldest
#            first, company, title and days waiting)
# C2_ctrl needs no earlier turn. Turn 12 also speaks of interviews (web
# tips), as a long chat would; it has none of C2_para's details.
turns:
  - user: How many job posts do we have, and from which dates?
    calls:
      - {name: query, args: {sql: "SELECT COUNT(*) AS posts, MIN(posted) AS first, MAX(posted) AS last FROM job_posts"}, result: "1 row:\nposts | first | last\n24 | 2026-09-02 | 2026-10-17"}
    answer: 24 posts, from 2026-09-02 to 2026-10-17.
  - user: Which post pays the most?
    calls:
      - {name: query, args: {sql: "SELECT id, company, title, salary_max FROM job_posts ORDER BY salary_max DESC LIMIT 1"}, result: "1 row:\nid | company | title | salary_max\n12 | Kraftwerk Labs | Backend Engineer | 98000"}
    answer: Post 12, Backend Engineer at Kraftwerk Labs, up to 98,000 EUR.
  - user: "Every weekday at 09:00 Berlin time, search the web for remote Go developer jobs posted in the last day, keep only the ones with a salary of at least 70,000 EUR, and save them into job_posts."
    calls:
      - name: save_pipeline
        args:
          yaml: |
            version: 1
            id: job_scan_go
            description: Remote Go developer jobs of the last day, 70,000 EUR or more, into job_posts
            trigger:
              schedule: "0 9 * * 1-5"
              timezone: Europe/Berlin
            steps:
              - id: find
                use: web.search
                with:
                  query: remote Go developer job
                  freshness: day
                  limit: 20
              - id: save
                use: db.insert
                for_each: ${{ steps.find.results }}
                if: ${{ item.salary_min >= 70000 }}
                with:
                  table: job_posts
                  on_conflict: skip
                  row:
                    company: ${{ item.company }}
                    title: ${{ item.title }}
                    city: ${{ item.city }}
                    remote: 1
                    salary_min: ${{ item.salary_min }}
                    salary_max: ${{ item.salary_max }}
                    posted: ${{ item.date }}
                    url: ${{ item.url }}
        result: saved pipeline (revision 1).
    answer: Saved job_scan_go. Monday to Friday at 09:00 Berlin time it searches for remote Go developer jobs from the last day and stores those paying at least 70,000 EUR in job_posts.
  - user: Start it once now so I can see what it finds.
    calls:
      - {name: run_pipeline, args: {id: job_scan_go}, result: started run r_311.}
    answer: Started run r_311.
  - user: I applied to post 12 today, 2026-09-24.
    calls:
      - {name: insert, args: {table: applications, rows: [{post_id: 12, applied_on: "2026-09-24", status: sent}]}, result: inserted 1 row into applications.}
    answer: Added your application to post 12 (Kraftwerk Labs), sent on 2026-09-24.
  - user: Save this Go salary report to resources, https://example.org/go-salaries-2026
    calls:
      - {name: save_link, args: {url: "https://example.org/go-salaries-2026", title: Go salary report 2026}, result: saved link 1 to Resources.}
    answer: Saved "Go salary report 2026".
  - user: How many of my applications are still just 'sent'?
    calls:
      - {name: query, args: {sql: "SELECT COUNT(*) AS n FROM applications WHERE status = 'sent'"}, result: "1 row:\nn\n5"}
    answer: Five.
  - user: "Make a table of my sent applications that have had no answer for 14 days or more, oldest first, with the company, the job title and the days waiting."
    calls:
      - name: save_view
        args:
          yaml: |
            version: 1
            id: stale_apps
            title: Waiting applications
            type: table
            query: |
              SELECT p.company, p.title, a.applied_on,
                     CAST(julianday('now') - julianday(a.applied_on) AS INTEGER) AS days_waiting
              FROM applications a
              JOIN job_posts p ON p.id = a.post_id
              WHERE a.status = 'sent'
                AND julianday('now') - julianday(a.applied_on) >= 14
              ORDER BY a.applied_on ASC
            columns:
              - { field: company, label: "Company" }
              - { field: title, label: "Job" }
              - { field: applied_on, label: "Sent", format: date }
              - { field: days_waiting, label: "Days waiting" }
        result: saved view (revision 1).
    answer: Saved stale_apps, "Waiting applications". It lists sent applications that have waited 14 days or more, oldest first, with the company, the job, the date sent and the days waiting.
  - user: What does "Werkstudent" mean in these German posts?
    answer: A Werkstudent is a student who works part time, usually up to 20 hours a week during term, at a company in their field. Those posts are for enrolled students only.
  - user: Which posts are in Berlin and remote?
    calls:
