  - user: P/E یعنی چه؟
    answer: نسبت قیمت به سود هر سهم است؛ یعنی قیمت سهم چند برابر سود سالانه‌ی هر سهم است. هرچه کمتر باشد، سهم نسبت به سودش ارزان‌تر است، ولی باید با هم‌صنعت‌هایش مقایسه شود.
  - user: وبملت در یک ماه گذشته چقدر بالا یا پایین رفته؟
    calls:
      - {name: query, args: {sql: "SELECT ROUND((SELECT close FROM tse_prices WHERE symbol = 'وبملت' ORDER BY date DESC LIMIT 1) * 100.0 / (SELECT close FROM tse_prices WHERE symbol = 'وبملت' AND date <= date('2026-10-19', '-1 month') ORDER BY date DESC LIMIT 1) - 100, 1) AS pct"}, result: "1 row:\npct\n4.6"}
    answer: ۴٫۶ درصد بالا رفته.
