#   turn 10: watch_drops, the follow-up C8_para needs (watchlist symbols,
#            5 trading days, 8%, sorted by the change)
#   turn 21: Shepna's last close, in the window, for C8_ctrl
turns:
  - user: در watchlist چه نمادهایی داریم؟
    calls:
      - {name: query, args: {sql: "SELECT symbol, note FROM watchlist ORDER BY symbol"}, result: "6 rows:\nsymbol | note\nخودرو | خودروسازی\nشپنا | پالایشی\nفملی | مس\nفولاد | فولاد مبارکه\nوبملت | بانکی\nکگل | سنگ آهن"}
