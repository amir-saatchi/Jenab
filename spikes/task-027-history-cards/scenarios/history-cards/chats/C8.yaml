    calls:
      - {name: query, args: {sql: "SELECT MIN(date) AS first, MAX(date) AS last, COUNT(DISTINCT date) AS days FROM tse_prices"}, result: "1 row:\nfirst | last | days\n2026-06-21 | 2026-10-19 | 82"}
    answer: از ۲۰۲۶-۰۶-۲۱ تا ۲۰۲۶-۱۰-۱۹، ۸۲ روز معاملاتی.
  - user: کدام نماد بیشترین حجم معامله را در روز آخر داشت؟
    calls:
      - {name: query, args: {sql: "SELECT symbol, volume FROM tse_prices WHERE date = (SELECT MAX(date) FROM tse_prices) ORDER BY volume DESC LIMIT 1"}, result: "1 row:\nsymbol | volume\nخودرو | 412000000"}
    answer: خودرو، با حدود ۴۱۲ میلیون سهم.
  - user: یادداشت کگل در watchlist چیست؟
    answer: «سنگ آهن».
  - user: "یک نمودار خطی از قیمت پایانی فولاد و فملی در سه ماه گذشته بساز، هر دو روی یک نمودار، همراه با میانگین متحرک ۲۰ روزه‌ی هر کدام."
    calls:
      - name: save_view
        args:
          yaml: |
            version: 1
            id: foulad_femeli_ma20
            title: فولاد و فملی با میانگین ۲۰ روزه
            type: chart
            chart_type: line
            query: |
              SELECT date, symbol, close,
                     AVG(close) OVER (PARTITION BY symbol ORDER BY date ROWS BETWEEN 19 PRECEDING AND CURRENT ROW) AS ma20
              FROM tse_prices
              WHERE symbol IN ('فولاد', 'فملی')
                AND date >= date('now', '-3 month')
              ORDER BY date
            x: { field: date, label: "تاریخ", format: date }
            y:
              - { field: close, label: "قیمت پایانی", series: symbol }
              - { field: ma20, label: "میانگین ۲۰ روزه", series: symbol, style: dashed }
        result: saved view (revision 1).
    answer: نمودار foulad_femeli_ma20 ذخیره شد؛ قیمت پایانی فولاد و فملی در سه ماه گذشته، هر کدام با میانگین متحرک ۲۰ روزه‌اش به صورت خط‌چین.
  - user: لینک کدال را ذخیره کن، https://example.ir/codal
    calls:
