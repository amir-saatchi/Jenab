    answer: فملی گزارش فروش شهریور را منتشر کرده و قیمت جهانی مس هم به بالاترین رقم شش ماه اخیر رسیده است.
  - user: "یک جدول بساز از نمادهای watchlist که در ۵ روز معاملاتی اخیر بیشتر از ۸ درصد افت کرده‌اند، با درصد تغییر، مرتب از بیشترین افت."
    calls:
      - name: save_view
        args:
          yaml: |
            version: 1
            id: watch_drops
            title: افت نمادهای دیده‌بان
            type: table
            query: |
              WITH d AS (
                SELECT DISTINCT date FROM tse_prices ORDER BY date DESC LIMIT 6
              ), p AS (
                SELECT t.symbol,
                       MAX(CASE WHEN t.date = (SELECT MAX(date) FROM d) THEN t.close END) AS last,
                       MAX(CASE WHEN t.date = (SELECT MIN(date) FROM d) THEN t.close END) AS first
                FROM tse_prices t
                JOIN watchlist w ON w.symbol = t.symbol
                WHERE t.date IN (SELECT date FROM d)
                GROUP BY t.symbol
              )
              SELECT symbol, ROUND((last - first) * 100.0 / first, 1) AS change_pct
              FROM p
              WHERE last < first * 0.92
              ORDER BY change_pct ASC
            columns:
              - { field: symbol, label: "نماد" }
              - { field: change_pct, label: "تغییر (درصد)" }
        result: saved view (revision 1).
    answer: جدول watch_drops ذخیره شد؛ نمادهای watchlist را که در ۵ روز معاملاتی اخیر بیشتر از ۸ درصد افت کرده‌اند با درصد تغییر نشان می‌دهد، از بیشترین افت.
