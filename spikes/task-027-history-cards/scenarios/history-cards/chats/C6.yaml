              - { field: id, label: "آگهی" }
              - { field: area_m2, label: "متراژ" }
              - { field: rooms, label: "خواب" }
              - { field: deposit_mt, label: "ودیعه (میلیون تومان)" }
              - { field: rent_mt, label: "اجاره (میلیون تومان)" }
              - { field: rent_per_m2, label: "اجاره‌ی هر متر (هزار تومان)" }
        result: saved view (revision 1).
    answer: جدول saadat_rent_per_m2 ذخیره شد. واحدهای ۸۰ تا ۱۲۰ متری سعادت‌آباد را با اجاره‌ی هر متر مربع به هزار تومان نشان می‌دهد، از ارزان‌ترین به گران‌ترین.
