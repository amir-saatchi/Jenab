  - user: "هر شنبه ساعت ۹ صبح، میانگین اجاره‌ی هر محله را برای آگهی‌های هفت روز گذشته حساب کن و در جدول rent_weekly بنویس. آگهی‌هایی که ودیعه‌شان بیشتر از ۵۰۰ میلیون است را حساب نکن."
    calls:
      - name: save_pipeline
        args:
          yaml: |
            version: 1
            id: rent_weekly_avg
            description: میانگین اجاره‌ی هر محله در هفت روز گذشته، بدون ودیعه‌های بالای ۵۰۰ میلیون
            trigger:
              schedule: "0 9 * * 6"
              timezone: Asia/Tehran
            steps:
              - id: avg
                use: db.query
                with:
                  sql: |
                    SELECT neighborhood, ROUND(AVG(rent_mt), 1) AS value
                    FROM rent_listings
                    WHERE posted >= date('now', '-7 day')
                      AND deposit_mt <= 500
                    GROUP BY neighborhood
              - id: save
                use: db.insert
                for_each: ${{ steps.avg.rows }}
                with:
                  table: rent_weekly
                  row:
                    week: ${{ now('2006-01-02') }}
                    neighborhood: ${{ item.neighborhood }}
                    metric: rent
                    value: ${{ item.value }}
        result: saved pipeline (revision 1).
    answer: rent_weekly_avg ذخیره شد. هر شنبه ساعت ۹ صبح به وقت تهران، میانگین اجاره‌ی آگهی‌های هفت روز گذشته را برای هر محله حساب می‌کند و با metric برابر rent در rent_weekly می‌نویسد. آگهی‌های با ودیعه‌ی بیشتر از ۵۰۰ میلیون حساب نمی‌شوند.
