  - user: "یک جدول از آگهی‌های سعادت‌آباد بساز که اجاره‌ی هر متر مربع را به هزار تومان نشان بدهد، فقط واحدهای ۸۰ تا ۱۲۰ متری، از ارزان‌ترین به گران‌ترین."
