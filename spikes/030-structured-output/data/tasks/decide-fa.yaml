id: decide-fa
kind: decide
lang: fa
instruction: |
  برای هر پیام مشتری به سه پرسش پاسخ بده:
  - complaint: آیا مشتری از چیزی که خراب شده یا درست پیش نرفته شکایت دارد؟
  - topic: یکی از billing، delivery، product، account یا other.
  - urgency: چقدر زود به پاسخ نیاز دارد، از ۱ (می‌تواند صبر کند) تا ۵ (همین الان).
input: |
  [0] برای سفارش اسفندم دو بار از حسابم پول کم شده. لطفاً یکی از پرداخت‌ها را برگردانید.
  [1] می‌توانم ایمیل حساب کاربری‌ام را عوض کنم؟
  [2] بسته سه روز دیر رسید و جعبه‌اش له شده بود.
  [3] ممنون، هدفون‌های جدید صدای عالی‌ای دارند!
  [4] از کارتم پول کم شده ولی سفارش هیچ‌جا دیده نمی‌شود.
  [5] به نروژ هم ارسال دارید؟
  [6] یک نفر از کشور دیگری وارد حسابم شده و رمزم را عوض کرده!
  [7] مخلوط‌کن بعد از دو روز از کار افتاد.
  [8] ساعت کاری‌تان در روزهای تعطیل رسمی چیست؟
  [9] بعد از پنج هفته هنوز پولم برنگشته. این قابل قبول نیست.
  [10] می‌شود فاکتوری با شماره‌ی اقتصادی شرکتم برایم بفرستید؟
  [11] صفحه‌ی رهگیری چهار روز است که «در حال تحویل» نشان می‌دهد.
  [12] این کاپشن سایز XL هم دارد؟
  [13] نمی‌توانم وارد شوم؛ ایمیل بازیابی رمز هیچ‌وقت نمی‌رسد و بلیت‌های کنسرت امشب را لازم دارم.
  [14] پیک شما بسته‌ام را زیر باران گذاشت و همه‌چیز داخلش خیس شده.
  [15] لطفاً حسابم را ببندید.
  [16] شارژری که فرستادید وقتی به برق می‌زنم بوی پلاستیک سوخته می‌دهد.
  [17] امسال حراج تابستانی دارید؟
  [18] لطفاً آدرس جدیدم را برای سفارش‌های بعدی در حسابم ثبت کنید.
  [19] دانه‌های قهوه‌ای که خریدم کهنه‌اند و بسته از قبل باز بود.
