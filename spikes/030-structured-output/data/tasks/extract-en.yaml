input: |
  Berlin Data Days 2027

  Organized by Spree Analytics GmbH.

  Join us on Thursday, 15 April 2027 at Kühlhaus Berlin (Luckenwalder Str. 3, 10963 Berlin, Germany) for a full day of talks on data engineering. The event is in person only; talks are not streamed.

  Tickets: €149 (early bird €99 until 1 March 2027).

  Speakers
  - Dr. Lena Vogt, Head of Data at Mobilio
  - Tomás Ruiz, independent consultant
  - Aiko Tanaka, DataForge

  Register at https://berlindatadays.example/register
  Questions? Write to hello@berlindatadays.example
