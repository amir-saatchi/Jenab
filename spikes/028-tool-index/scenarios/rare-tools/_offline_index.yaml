# Scripted answers for condition 2, to test the harness with no keys: a
# native call of a tool in the index, a blind call_tool with a wrong
# argument name, then describe_tool and a good call.
scenarios:
  R1_save_link:
    - calls: [{name: save_link, args: {url: "https://example.org/learn/halving", title: Halving explained}}]
    - calls: [{name: call_tool, args: {name: save_link, arguments: {link: "https://example.org/learn/halving", title: Halving explained}}}]
    - calls: [{name: describe_tool, args: {name: save_link}}]
    - calls: [{name: call_tool, args: {name: save_link, arguments: {url: "https://example.org/learn/halving", title: Halving explained, note: good intro for new readers, tags: [btc, education]}}}]
    - text: Saved.
  R2_connect_api:
    - calls: [{name: describe_tool, args: {name: connect_api}}]
    - calls: [{name: call_tool, args: {name: connect_api, arguments: {id: coincap, title: CoinCap, base_url: "https://api.coincap.example/v2", auth: {type: none}, docs: "https://docs.coincap.example", rate_limit: {requests: 10, per: minute}}}}]
    - text: Proposed.
  R3_read_feed:
    - calls: [{name: call_tool, args: {name: read_feed, arguments: {url: "https://feeds.example/crypto.xml", match: ETF}}}]
    - text: Spot Bitcoin ETFs took in $1.2 billion in a week.
  R4_bucket_put:
    - calls: [{name: describe_tool, args: {name: bucket_put}}]
    - calls: [{name: call_tool, args: {name: bucket_put, arguments: {key: notes/halving.md, content: "The block reward halves every 210,000 blocks, about every four years."}}}]
    - text: Stored.
