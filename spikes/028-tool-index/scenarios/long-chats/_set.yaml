# SPIKE-028: long chats. The harness seeds ten earlier turns from
# ../long-history/ before the scenario's one message, so that message is
# turn 11 and the window cuts at its start: turns 1-7 are past the cut
# (history_min_turns 3). The follow-up needs details that only an earlier
# turn has; the checks read the last turn's save_* arguments.
title: Coin tracker
card: card.md
today: 2026-10-06
fixture: fixture.sql

tools:
  - name: query
    areas: [tables]
    description: Run one read-only SQL SELECT on the project database; returns up to 200 rows and the total count.
    schema: {type: object, properties: {sql: {type: string}}, required: [sql], additionalProperties: false}
    kind: sql
    arg: sql
  - name: describe_table
    areas: [tables]
    description: Columns, types, keys, indexes and row count of a table.
    schema: {type: object, properties: {name: {type: string}}, required: [name], additionalProperties: false}
    kind: describe
    arg: name
  - name: save_view
    areas: [views]
    description: Validate and save a table or chart view config (full YAML). Returns all errors with paths, or success.
    schema: {type: object, properties: {yaml: {type: string}}, required: [yaml], additionalProperties: false}
  - name: save_pipeline
    areas: [pipelines]
    description: Validate and save a pipeline config (full YAML). Returns all errors with paths, or success.
    schema: {type: object, properties: {yaml: {type: string}}, required: [yaml], additionalProperties: false}
  - name: run_pipeline
    areas: [pipelines]
    description: Start a pipeline run; returns the run ID.
    schema:
      type: object
      properties:
        id: {type: string}
        inputs: {type: object}
      required: [id]
      additionalProperties: false
  - name: web_search
    description: Search the web or the news; returns titles, URLs, dates and snippets.
    schema:
      type: object
      properties:
        query: {type: string}
        limit: {type: integer, minimum: 1, maximum: 20}
        freshness: {type: string, enum: [day, week, month, any]}
      required: [query]
      additionalProperties: false
  - name: save_link
    description: Save a link to the project's Resources panel, with a title, an optional note and tags.
    schema:
      type: object
      properties:
        url: {type: string, pattern: '^https?://'}
        title: {type: string, minLength: 1}
        note: {type: string}
        tags: {type: array, items: {type: string, pattern: '^[a-z0-9-]+$'}, maxItems: 10}
      required: [url, title]
      additionalProperties: false

rules:
  save_view:
    - result: saved view (revision 1).
  save_pipeline:
    - result: saved pipeline (revision 1).
  run_pipeline:
    - result: started run r_101.
  web_search:
    - result: no results
  save_link:
    - result: saved link 2 to Resources.
