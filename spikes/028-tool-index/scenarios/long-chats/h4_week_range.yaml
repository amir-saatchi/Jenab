id: H4_week_range
title: The weekly range table, for ETH (paraphrase, some shared words)
tests: ["history"]
context: main
why: >-
  Turn 5, past the cut, built btc_weekly_range: the last 12 weeks with
  each week's Low, High and Close. The follow-up calls it a "per-week
  spread"; a good answer finds turn 5 and saves the same table on
  eth_prices, with a Close column over 12 weeks.
messages:
  - text: "Can I see the per-week spread for Ether as well? It's in eth_prices."
asserts:
  - {type: tool_called, test: history, turn: "11", tool: save_view, args_match: 'eth_prices'}
  - {type: tool_called, test: history, turn: "11", tool: save_view, args_match: '(?i)close'}
  - {type: tool_called, test: history, turn: "11", tool: save_view, args_match: '\b12\b|\b84\b'}
  - {type: tool_called, test: info, turn: "11", tools: [search_history, read_messages]}
