# Earlier turns every long chat shares, in order. A chat's own turn goes
# in at its place (at:), and the filler fills the rest up to ten turns.
# A call's result is what the tool gave back.
turns:
  - user: How many days of prices do we have in btc_prices?
    calls:
      - {name: query, args: {sql: "SELECT COUNT(*) AS days, MIN(date) AS first, MAX(date) AS last FROM btc_prices"}, result: "1 row:\ndays | first | last\n10 | 2026-09-26 | 2026-10-05"}
    answer: Ten days, from 2026-09-26 to 2026-10-05.
  - user: What was the highest BTC price in that range?
    calls:
      - {name: query, args: {sql: "SELECT date, price FROM btc_prices ORDER BY price DESC LIMIT 1"}, result: "1 row:\ndate | price\n2026-09-26 | 61000"}
    answer: The highest was 61,000 USD on 2026-09-26; it has gone down a little every day since.
  - user: Add 'halving' to the news keywords.
    calls:
      - {name: insert, args: {table: watch_keywords, rows: [{keyword: halving}]}, result: inserted 1 row into watch_keywords.}
    answer: Done. The news keywords are now ETF, regulation and halving.
  - user: Save the Bitcoin whitepaper to our resources, https://example.org/bitcoin.pdf
    calls:
      - {name: save_link, args: {url: "https://example.org/bitcoin.pdf", title: Bitcoin whitepaper}, result: saved link 1 to Resources.}
    answer: Saved "Bitcoin whitepaper" to Resources.
  - user: When does daily_btc run?
    answer: Every day at 08:00 UTC, and you can start it by hand. It has not run yet.
  - user: Which BTC news did we store on 2026-10-04?
    calls:
      - {name: query, args: {sql: "SELECT title, url FROM btc_news WHERE date = '2026-10-04'"}, result: "2 rows:\ntitle | url\nSeed story 2 | https://news.example.com/b/2\nSeed story 3 | https://news.example.com/b/3"}
    answer: Two stories, "Seed story 2" and "Seed story 3".
  - user: What is the average BTC price over the ten days?
    calls:
      - {name: query, args: {sql: "SELECT ROUND(AVG(price), 1) AS avg FROM btc_prices"}, result: "1 row:\navg\n60550.0"}
    answer: 60,550 USD.
  - user: And how much did ETH move over the same days?
    calls:
      - {name: query, args: {sql: "SELECT MIN(price) AS low, MAX(price) AS high FROM eth_prices"}, result: "1 row:\nlow | high\n2299 | 2410"}
    answer: ETH ranged from 2,299 to 2,410 USD, about 5% from low to high.
  - user: Thanks. Which views do we have now?
    answer: btc_avg14_chart, btc_news_table, btc_price_chart, btc_price_news and btc_weekly_range.
