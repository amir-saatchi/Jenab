version: 2
id: daily_btc
trigger:
  schedule: "every morning"
  timezone: Mars/Olympus
  catch_up: sometimes
steps:
  - id: price
    use: http.get
    with:
      url: ftp://api.example.com/btc
      fail_on_status: "no"
  - id: save
    use: db.insert
    with:
      table: btc_prices
      on_conflict: replace
  - use: db.query
    with:
      sql: SELECT 1
      limit: 10
on_eror: continue
