version: 1
id: daily_btc
inputs:
  coin: { type: text, default: BTC }
  Max-Days: { type: number }
  days: { default: 90 }
trigger:
  manual: true
steps:
  - id: price
    use: http.get
    with:
      url: https://api.example.com/btc
