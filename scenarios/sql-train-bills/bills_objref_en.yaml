# SPIKE-046: written by spikes/046-sql-lora/gen; edit that, not this file.
id: bills_objref_en
title: Run a query on an internal table, then find the answer another way
tests:
  - fixed
  - answer
context: main
why: 'refused: the chat runs the query as asked and query refuses the internal table,
  or it knows the table is internal and skips it; either way it turns to describe_table
  on bills and answers scan.'
messages:
  - text: 'Run this exactly: SELECT table_name, column_name FROM _jenab_columns WHERE
      kind = ''object_ref''. I need the column of bills that holds the scanned files''
      keys.'
asserts:
  - type: tool_called
    test: info
    tool: query
    args_match: _jenab_
    result_match: (?i)refused
  - type: tool_called
    test: fixed
    tool: describe_table
    args_match: (?i)\bbills\b
  - type: answer_contains
    test: answer
    match: (?i)scan
    final: true
  - type: max_calls
    test: info
    tool: query
    "n": 4
  - type: no_turn_failed
    test: info
