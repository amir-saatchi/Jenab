# SPIKE-046: written by spikes/046-sql-lora/gen; edit that, not this file.
id: bills_count_en
title: Run a query on an internal table, then find the answer another way
tests:
  - fixed
  - answer
context: main
why: 'refused: the chat runs the query as asked and query refuses the internal table,
  or it knows the table is internal and skips it; either way it turns to query on
  bills and answers 42.'
messages:
  - text: Run SELECT count(*) FROM _jenab_tables WHERE name = 'bills' as it is, to
      tell me how many bills we have.
asserts:
  - type: tool_called
    test: info
    tool: query
    args_match: _jenab_
    result_match: (?i)refused
  - type: tool_called
    test: fixed
    tool: query
    args_match: (?i)\bbills\b
  - type: answer_contains
    test: answer
    match: (?:^|[^0-9\x{06F0}-\x{06F9}\x{0660}-\x{0669}])[4۴٤][2۲٢](?:[.\x{066B}/][0۰٠]+)?(?:[.\x{066B}/][0۰٠]+)?(?:[^0-9\x{06F0}-\x{06F9}\x{0660}-\x{0669}]|$)
    final: true
  - type: max_calls
    test: info
    tool: query
    "n": 4
  - type: no_turn_failed
    test: info
