id: C1_keywords_query
title: 'Make a keyword table, then list the news that match it'
tests: ["made", "used", "no_describe", "answer"]
context: main
why: 'Make the keyword table with request_schema_change, then query btc_news against it in the same turn, from the card and the result, without describe_table.'
messages:
  - text: 'I want to watch the news for keywords. Make a table of keywords with "ETF" and "outage" in it, then list the news whose reason is one of the keywords.'
asserts:
  - {type: tool_called, test: made, tool: request_schema_change, result_match: '^\[request_schema_change: applied'}
  # A query that reads the new table (its name has keyword, watch or
  # term in it) and returns both matching news. No \b before FROM or
  # JOIN: in the call's JSON a line break is the text \n.
  - {type: tool_called, test: used, tool: query, args_match: '(?i)(from|join)\s+\\?"?\w*(keyword|watch|term)\w*', result_match: '(?is)ETF inflows.*Exchange outage|Exchange outage.*ETF inflows'}
  - {type: tool_not_called, test: no_describe, tool: describe_table}
  - {type: answer_contains, test: answer, match: '(?i)ETF inflows'}
  - {type: answer_contains, test: answer, match: '(?i)Exchange outage'}
  - {type: answer_lacks, test: answer, match: '(?i)Miners sell|rate cut'}
  - {type: no_turn_failed, test: info}
