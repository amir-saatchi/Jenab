# P2-13: the token and accuracy benchmark (PROPOSAL 11, N-42). Two weeks
# of the Bitcoin project in one chat: set up, a daily update on most days,
# a change of goal (also Ethereum) and questions about earlier work, each
# checked against the pages. Run it in both harnesses, side by side:
#
#   jenab-scenarios run -harness jenab,plain -reps 3 -model <m> scenarios/bench-bitcoin
#
# jenab is the app: the real data tools, request_schema_change with the
# schema agent, memory, session notes, the history window and its cuts,
# history cards. plain is a plain chat harness on the same model and
# messages (agent Deps.Plain): block 1 alone, the whole history in every
# request, and only fetch_page, read_ref, search_ref and ask_user.
#
# The data comes from one fixture page a day, a fake fetch_page of kind
# page: it is stored in the bucket as a fetched page, so it has a ref and
# becomes a stub at a cut, as a real page does. Any URL with the day's date
# gets that day's page; others get a 404. The pages are pages/<day>.md.
#
# Each message has its day. The runner's clock moves with it, so block 1's
# date is the day's, and the first turn of a day cuts the window as after a
# night (the cache's idle time, 3.6).
title: Crypto tracker
project_card: true
today: 2026-10-05
settings:
  # Both harnesses: a turn that loops stops sooner than the app's 25, so a
  # weak model can't use up a free tier's day.
  llm: {turn_max_requests: 12}
tools:
  - {name: fetch_page, kind: page}
rules:
  fetch_page:
    - {match: '2026-10-05', file: pages/2026-10-05.md}
    - {match: '2026-10-06', file: pages/2026-10-06.md}
    - {match: '2026-10-07', file: pages/2026-10-07.md}
    - {match: '2026-10-08', file: pages/2026-10-08.md}
    - {match: '2026-10-09', file: pages/2026-10-09.md}
    - {match: '2026-10-10', file: pages/2026-10-10.md}
    - {match: '2026-10-11', file: pages/2026-10-11.md}
    - {match: '2026-10-12', file: pages/2026-10-12.md}
    - {match: '2026-10-13', file: pages/2026-10-13.md}
    - {match: '2026-10-14', file: pages/2026-10-14.md}
    - {match: '2026-10-15', file: pages/2026-10-15.md}
    - {match: '2026-10-16', file: pages/2026-10-16.md}
