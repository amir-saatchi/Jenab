# Scripted answers for an offline run of this set: no model, no keys.
#   jenab-scenarios run -harness jenab,plain -model scripted:scenarios/bench-bitcoin/_offline.yaml scenarios/bench-bitcoin
# It tests the runner and both harnesses, not a model. The replies fetch
# the pages and answer from them, as a plain chat would; they use no data
# tools, so the jenab harness's info checks on them fail.
scenarios:
  B1_two_weeks:
    - {calls: [{name: fetch_page, args: {url: "https://markets.example/daily/2026-10-05"}}], usage: {input: 1500, output: 40}}
