id: t12_b_staking_pages_pow_pos
title: Summarise 20 pages (subagent, 90 s) plus a quick PoW vs PoS question
tests: ["1", "2"]
context: main
needs: [background]
why: 'Answer PoW vs PoS at once, start a background subagent for the 20 pages, say so; the finish turn gives the summary without explaining PoW/PoS again.'
messages:
  - text: |
      Please summarise these 20 articles about Ethereum staking for me. Meanwhile, quick question: what's the difference between proof of work and proof of stake?
      1. https://staking.example.org/article-01
      2. https://staking.example.org/article-02
      3. https://staking.example.org/article-03
      4. https://staking.example.org/article-04
      5. https://staking.example.org/article-05
      6. https://staking.example.org/article-06
      7. https://staking.example.org/article-07
      8. https://staking.example.org/article-08
      9. https://staking.example.org/article-09
      10. https://staking.example.org/article-10
      11. https://staking.example.org/article-11
      12. https://staking.example.org/article-12
      13. https://staking.example.org/article-13
      14. https://staking.example.org/article-14
      15. https://staking.example.org/article-15
      16. https://staking.example.org/article-16
      17. https://staking.example.org/article-17
      18. https://staking.example.org/article-18
      19. https://staking.example.org/article-19
      20. https://staking.example.org/article-20
asserts:
  - {type: quick_before_finish, test: "1", match_all: ['(?i)validator|\bstake[sd]?\b|collateral', '(?i)miner|mining|computational|hash ?power|hashing|energy|puzzle'], tools: [subagent, fetch_page]}
  - {type: slow_started, test: "1", tools: [subagent, fetch_page]}
  - {type: text_before_tool, test: info, tool: subagent}
  - {type: background_started, test: info, tools: [subagent]}
  - {type: mentions_running, test: info}
  - {type: answer_contains, test: "2", turn: finish, match: '(?i)2\.9|withdrawal|liquid staking|slashing'}
  - {type: no_repeat, test: "2", max_overlap: 0.3, markers: ['(?i)proof of work (uses|relies|requires|is)', '(?i)miners (compete|solve|use)', '(?i)validators (lock|stake|put up)']}
  - {type: no_restart, test: "2", tools: [subagent, fetch_page]}
