id: F2_table
title: 'Set up a table for my daily BTC prices: date, open, high, low and close.'
tests: ["made", "columns", "tools", "ui"]
context: mother
why: 'Make the table with request_schema_change, which the schema agent applies (P2-06), with the five columns; no SQL saved to the bucket as the setup; no app screens.'
messages:
  - text: 'Set up a table for my daily BTC prices: date, open, high, low and close.'
asserts:
  - {type: tool_called, test: made, tool: request_schema_change, result_match: '^\[request_schema_change: applied'}
  # An applied result ends with the tables, one per line, as
  # "- name (N rows): col TYPE, col TYPE; key (…)", so the order of the
  # columns doesn't matter. All five are columns of one table, before the
  # first ";" (the keys), in one applied call's result.
  - type: tool_called
    test: columns
    tool: request_schema_change
    result_match: '^\[request_schema_change: applied'
    result_line_all:
      - '(?i)^- \S+ \([\d,]+ rows?\): ([^;]*, )?date\b'
      - '(?i)^- \S+ \([\d,]+ rows?\): ([^;]*, )?open\b'
      - '(?i)^- \S+ \([\d,]+ rows?\): ([^;]*, )?high\b'
      - '(?i)^- \S+ \([\d,]+ rows?\): ([^;]*, )?low\b'
      - '(?i)^- \S+ \([\d,]+ rows?\): ([^;]*, )?close\b'
  - {type: tool_not_called, test: tools, tool: bucket_put, args_match: '(?i)\.(sql|py|js|ts|sh|ps1|ya?ml|json)\b|create\s+table|insert\s+into|import\s+\w+'}
  - {type: answer_lacks, test: ui, match: '(?i)\b(section|tab|panel|menu|screen|sidebar|toolbar)s?\b|\bclick\b|\bnavigate to\b|\bterminal\b|\bcommand line\b'}
  - {type: answer_delivered, test: info}
