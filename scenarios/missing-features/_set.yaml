# TASK-014: a new project with the tools the app has today, on an empty
# database. The data tools (query, describe_table, insert) read tables and
# add rows, and request_schema_change creates and changes tables through
# the schema agent (P2-06), but there are no pipelines or views. So asked
# for one of those, the agent says it can't do that yet, instead of saving
# SQL or scripts that pose as the setup, naming another place where it
# could be done, or describing screens it can't see. Three requests it can
# do (a table, a question, a note) check that it doesn't refuse them too.
#
# No fixture, no data and no card: the database has no tables. fetch_page
# is a fake with the real tool's text, so a run never reaches the network.
title: Crypto notes
today: 2026-10-13   # the day of the test chat this set comes from

tools:
  - name: fetch_page

rules:
  fetch_page:
    - result: |
        Bitcoin (BTC) price today: 61,240 USD, +1.2% in 24 hours. Market cap 1.21T USD.
