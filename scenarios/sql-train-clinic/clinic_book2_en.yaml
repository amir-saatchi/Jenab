# SPIKE-046: written by spikes/046-sql-lora/gen; edit that, not this file.
id: clinic_book2_en
title: Please book P-015 with DR-02 on 2026-10-13 at 14:00.
tests:
  - insert
  - row
  - says
context: main
why: 'Find the patient''s and the doctor''s IDs with query first. insert: add the
  row to appointments with insert; at the end the check reads P-015|DR-02|2026-10-13
  00:00:00 +0000 UTC|14:00|booked.'
messages:
  - text: Please book P-015 with DR-02 on 2026-10-13 at 14:00.
asserts:
  - type: tool_called
    test: insert
    tool: insert
    args_match: '"table":\s*"appointments"'
  - type: tool_called
    test: insert
    tool: insert
    args_match: (?i)"2026-10-13"
  - type: tool_called
    test: insert
    tool: insert
    args_match: '[:\[,\s"]2(?:\.0+)?["\s,}\]]'
  - type: tool_called
    test: insert
    tool: insert
    args_match: '[:\[,\s"]15(?:\.0+)?["\s,}\]]'
  - type: tool_called
    test: insert
    tool: insert
    args_match: (?i)"booked"
  - type: tool_called
    test: insert
    tool: insert
    args_match: (?i)"14:00"
  - type: db_query
    test: row
    match: (?m)^P-015\|DR-02\|2026-10-13 00:00:00 \+0000 UTC\|14:00\|booked$
    query: |-
      SELECT p.code, d.code, a.date, substr(a.time, 1, 5), a.status FROM appointments a JOIN patients p ON p.id = a.patient_id JOIN doctors d ON d.id = a.doctor_id
      WHERE p.code = 'P-015' AND a.date = '2026-10-13'
  - type: answer_lacks
    test: says
    match: (?i)can't|cannot|unable|not (yet )?(possible|supported)
    final: true
  - type: max_calls
    test: info
    tool: insert
    "n": 1
  - type: no_turn_failed
    test: info
