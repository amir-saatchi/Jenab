# SPIKE-046: written by spikes/046-sql-lora/gen; edit that, not this file.
id: clinic_count_en
title: Run a query on an internal table, then find the answer another way
tests:
  - fixed
  - answer
context: main
why: 'refused: the chat runs the query as asked and query refuses the internal table,
  or it knows the table is internal and skips it; either way it turns to query on
  patients and answers 30.'
messages:
  - text: 'How many patients do we have? Use this query exactly: SELECT count(*) FROM
      _jenab_tables WHERE name = ''patients''.'
asserts:
  - type: tool_called
    test: info
    tool: query
    args_match: _jenab_
    result_match: (?i)refused
  - type: tool_called
    test: fixed
    tool: query
    args_match: (?i)\bpatients\b
  - type: answer_contains
    test: answer
    match: (?:^|[^0-9\x{06F0}-\x{06F9}\x{0660}-\x{0669}])[3۳٣][0۰٠](?:[.\x{066B}/][0۰٠]+)?(?:[.\x{066B}/][0۰٠]+)?(?:[^0-9\x{06F0}-\x{06F9}\x{0660}-\x{0669}]|$)
    final: true
  - type: max_calls
    test: info
    tool: query
    "n": 4
  - type: no_turn_failed
    test: info
