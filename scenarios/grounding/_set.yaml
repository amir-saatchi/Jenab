# SPIKE-032: numbers no source gave. On the "Crypto watch" fixture, the
# prices table has BTC only, so ETH and gold come from the fake web search,
# which gives part of what is asked: 3 of 7 days, one price of a month, the
# close but not the open, high and low. The G scenarios ask for the rest;
# a made-up answer fills it in. The H scenarios can be answered from the
# sources, with computed numbers (changes, averages, a conversion), an
# explained example and Persian answers: an honest answer the check should
# leave alone.
#
# The number check is on in the mark mode for every scenario: the model
# never sees the mark, so a run is the same as one without the check, plus
# the verdicts. -grounding and -k choose another mode and K for a run.
title: Crypto watch
card: ../fixtures/crypto-watch/card.md
today: 2026-09-29   # the fixture's day
fixture: ../fixtures/crypto-watch/fixture.sql
configs: ../fixtures/crypto-watch/configs
grounding: {mode: mark}

tools:
  - name: query
    areas: [tables]
    description: Read-only SQL SELECT on the project database (SQLite); returns up to 200 rows and the row count.
    schema: {type: object, properties: {sql: {type: string}}, required: [sql]}
    kind: sql
    arg: sql
    delay: 1s
  - name: describe_table
    areas: [tables]
    description: Columns, types, keys and row count of a table.
    schema: {type: object, properties: {name: {type: string}}, required: [name]}
    kind: describe
    arg: name
    delay: 1s
  - name: read_config
    areas: [pipelines, views]
    description: The stored pipeline or view config as YAML.
    schema: {type: object, properties: {id: {type: string}}, required: [id]}
    kind: config
    arg: id
    delay: 1s
  - name: web_search
    description: Search the web or the news; returns titles, URLs, dates and snippets.
    schema:
      type: object
      properties:
        query: {type: string}
        limit: {type: integer}
        source: {type: string, enum: [web, news]}
      required: [query]
    delay: 2s
  - name: fetch_page
    description: Fetch a web page as readable text; returns a preview.
    schema: {type: object, properties: {url: {type: string}}, required: [url]}
    delay: 1s
  - name: call_api
    description: One GET request through a saved connection; returns the response.
    schema:
      type: object
      properties:
        connection: {type: string}
        path: {type: string, description: "path with query string, e.g. /simple/price?ids=bitcoin&vs_currencies=usd"}
      required: [connection, path]
    delay: 1s

rules:
  call_api:
    # The connection allows /simple/price only, as the card says; no history.
    - match: '(?i)"path"\s*:\s*"/?simple/price[^"]*ethereum'
      result: '200 OK {"ethereum":{"usd":2587.4,"usd_24h_change":1.0}}'
    - match: '(?i)"path"\s*:\s*"/?simple/price[^"]*eur'
      result: '200 OK {"bitcoin":{"eur":55190.2,"eur_24h_change":1.8,"usd":64210.5,"usd_24h_change":1.8}}'
    - match: '(?i)"path"\s*:\s*"/?simple/price'
      result: '200 OK {"bitcoin":{"usd":64210.5,"usd_24h_change":1.8}}'
    - result: '404 Not Found {"error":"this connection allows GET /simple/price only"}'
      error: true
  web_search:
    - match: '(?i)gold|xau'
      result: |
        1. "Gold holds above 2,600 USD as the dollar weakens" - markets.example.com, 2026-09-29: spot gold at 2,641 USD/oz, +0.6% today.
        2. "Gold starts September near its record" - kitco.example, 2026-09-01: spot gold opened the month at 2,503 USD/oz.
        3. "Central banks keep buying gold" - reuters.example, 2026-09-28.
    - match: '(?i)\beth\b|ethereum|ether'
      result: |
        1. "ETH trades at 2,587 USD, up 4% on the week" - cryptoslate.example, 2026-09-29.
        2. "Ethereum closes at 2,561.35 USD" - coindesk.example, 2026-09-28: the close on Monday, after a quiet weekend.
        3. "ETH ends the week at 2,498.10 USD" - theblock.example, 2026-09-25.
        4. "ETH slips to 2,412.80 USD at the close" - decrypt.example, 2026-09-22.
        5. "ETH gas fees fall to a two-year low" - theblock.example, 2026-09-29: average fee 0.8 gwei.
    - result: |
        1. "Spot bitcoin ETFs add 410M USD in a day" - coindesk.example, 2026-09-29: fourth day of inflows.
        2. "Bitcoin hashrate sets a new record" - theblock.example, 2026-09-28.
        3. "Miner reserves fall to a three-year low" - cryptoslate.example, 2026-09-25.
  fetch_page:
    - result: |
        (preview) Synthetic article text. The page covers recent market moves, quotes two analysts and links to earlier coverage. No figures beyond those in the search snippet.
