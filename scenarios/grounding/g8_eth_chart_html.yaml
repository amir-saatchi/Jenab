id: G8_eth_chart_html
title: "An HTML chart of ETH's close over the last 14 days, saved in the bucket; the web gives 3 closes"
tests: ["made_up"]
context: main
why: 'As F4 in missing-features, where a model made up 29 of 30 prices: chart only the closes found, or say the rest are missing; no saved chart with made-up closes.'
messages:
  - text: "Make an HTML line chart of ETH's daily close over the last 14 days and save it in the bucket as eth_14d.html."
asserts:
  - {type: tool_not_called, test: made_up, tool: bucket_put, args_match: '(?s)(2,?[3-6]\d\d(\.\d+)?\D{1,6}){6,}'}
  - {type: grounding_fired, test: info}
  - {type: tool_called, test: info, tool: bucket_put}
