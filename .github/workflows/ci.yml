name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      # The app needs no C compiler (N-51; MyGo needs no cgo), so cgo stays
      # off on Windows. -race needs it, so it is on elsewhere.
      CGO_ENABLED: ${{ startsWith(matrix.os, 'windows') && '0' || '1' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Format
        if: runner.os == 'Linux'
        run: test -z "$(go fmt ./...)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            go test ./...
          else
            go test -race ./...
          fi

      - name: Build
        run: go build -o jenab-build ./cmd/desktop
