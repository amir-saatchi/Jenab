<text x="1030.0" y="822.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">9</text>
<text x="1325.0" y="72.0" font-size="14" fill="#2b2b2b" font-weight="600">Notes</text>
<circle cx="1335.0" cy="92.0" r="10" fill="#d9480f"/>
<text x="1335.0" y="96.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">1</text>
<text x="1353.0" y="96.0" font-size="12" fill="#2b2b2b">The quick part is answered first, before</text>
<text x="1353.0" y="112.0" font-size="12" fill="#2b2b2b">any slow work (the SPEC 8.3 prompt rule).</text>
<circle cx="1335.0" cy="131.0" r="10" fill="#d9480f"/>
<text x="1335.0" y="135.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">2</text>
<text x="1353.0" y="135.0" font-size="12" fill="#2b2b2b">A finished tool call is a one-line chip.</text>
<text x="1353.0" y="151.0" font-size="12" fill="#2b2b2b">Expanding it shows the query, a result</text>
<text x="1353.0" y="167.0" font-size="12" fill="#2b2b2b">preview and the time.</text>
<circle cx="1335.0" cy="186.0" r="10" fill="#d9480f"/>
<text x="1335.0" y="190.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">3</text>
<text x="1353.0" y="190.0" font-size="12" fill="#2b2b2b">Background work: the chip keeps running</text>
<text x="1353.0" y="206.0" font-size="12" fill="#2b2b2b">after the turn ends, with its own Stop.</text>
<circle cx="1335.0" cy="225.0" r="10" fill="#d9480f"/>
<text x="1335.0" y="229.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">4</text>
<text x="1353.0" y="229.0" font-size="12" fill="#2b2b2b">The agent says what is still running.</text>
<circle cx="1335.0" cy="248.0" r="10" fill="#d9480f"/>
<text x="1335.0" y="252.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">5</text>
<text x="1353.0" y="252.0" font-size="12" fill="#2b2b2b">A finish notice starts a new turn, marked</text>
<text x="1353.0" y="268.0" font-size="12" fill="#2b2b2b">"Started by the app", with its own Undo</text>
<text x="1353.0" y="284.0" font-size="12" fill="#2b2b2b">turn.</text>
<circle cx="1335.0" cy="303.0" r="10" fill="#d9480f"/>
<text x="1335.0" y="307.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">6</text>
<text x="1353.0" y="307.0" font-size="12" fill="#2b2b2b">Memory chip with undo and edit.</text>
<circle cx="1335.0" cy="326.0" r="10" fill="#d9480f"/>
<text x="1335.0" y="330.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">7</text>
<text x="1353.0" y="330.0" font-size="12" fill="#2b2b2b">The schema agent works as a chip; a</text>
<text x="1353.0" y="346.0" font-size="12" fill="#2b2b2b">migration shows its plan when expanded.</text>
<circle cx="1335.0" cy="365.0" r="10" fill="#d9480f"/>
<text x="1335.0" y="369.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">8</text>
<text x="1353.0" y="369.0" font-size="12" fill="#2b2b2b">A message written during a turn waits in</text>
<text x="1353.0" y="385.0" font-size="12" fill="#2b2b2b">a dashed bubble, then joins at the next</text>
<text x="1353.0" y="401.0" font-size="12" fill="#2b2b2b">step.</text>
<circle cx="1335.0" cy="420.0" r="10" fill="#d9480f"/>
<text x="1335.0" y="424.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">9</text>
<text x="1353.0" y="424.0" font-size="12" fill="#2b2b2b">Stop cancels the running turn.</text>
<text x="1325.0" y="457.0" font-size="14" fill="#2b2b2b" font-weight="600">Open questions</text>
<circle cx="1335" cy="477" r="10" fill="#fff" stroke="#d9480f" stroke-width="1.5"/>
<text x="1335.0" y="481.0" font-size="11" fill="#d9480f" font-weight="600" text-anchor="middle">?</text>
<text x="1353.0" y="481.0" font-size="12" fill="#2b2b2b">Show the finish-notice text itself, or</text>
<text x="1353.0" y="497.0" font-size="12" fill="#2b2b2b">only the separator?</text>
<circle cx="1335" cy="516" r="10" fill="#fff" stroke="#d9480f" stroke-width="1.5"/>
<text x="1335.0" y="520.0" font-size="11" fill="#d9480f" font-weight="600" text-anchor="middle">?</text>
<text x="1353.0" y="520.0" font-size="12" fill="#2b2b2b">Group tool chips ("3 steps ▸") by</text>
<text x="1353.0" y="536.0" font-size="12" fill="#2b2b2b">default, or always show each one?</text>
<text x="1325.0" y="569.0" font-size="14" fill="#2b2b2b" font-weight="600">Requirements</text>
<text x="1325.0" y="589.0" font-size="12" fill="#767676">R-14, R-15, R-16, R-24</text>
