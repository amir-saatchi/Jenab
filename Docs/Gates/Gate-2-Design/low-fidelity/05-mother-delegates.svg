<text x="1353.0" y="174.0" font-size="12" fill="#2b2b2b">The chat list shows who is working for</text>
<text x="1353.0" y="190.0" font-size="12" fill="#2b2b2b">Mother.</text>
<circle cx="1335.0" cy="209.0" r="10" fill="#d9480f"/>
