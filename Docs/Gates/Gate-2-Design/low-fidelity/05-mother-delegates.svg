<text x="1353.0" y="346.0" font-size="12" fill="#2b2b2b">The user can read and write in every chat</text>
<text x="1353.0" y="362.0" font-size="12" fill="#2b2b2b">at any time.</text>
<text x="1325.0" y="395.0" font-size="14" fill="#2b2b2b" font-weight="600">Open questions</text>
