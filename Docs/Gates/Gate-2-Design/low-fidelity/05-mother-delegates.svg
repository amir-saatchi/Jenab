<text x="1335.0" y="135.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">2</text>
<text x="1353.0" y="135.0" font-size="12" fill="#2b2b2b">create_chat: a new chat with a title and</text>
<text x="1353.0" y="151.0" font-size="12" fill="#2b2b2b">a role, for a lasting job.</text>
<circle cx="1335.0" cy="170.0" r="10" fill="#d9480f"/>
