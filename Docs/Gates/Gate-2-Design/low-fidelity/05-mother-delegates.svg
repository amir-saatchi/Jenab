<text x="1353.0" y="307.0" font-size="12" fill="#2b2b2b">In the target chat, Mother's message is</text>
<text x="1353.0" y="323.0" font-size="12" fill="#2b2b2b">marked "from Mother".</text>
<circle cx="1335.0" cy="342.0" r="10" fill="#d9480f"/>
