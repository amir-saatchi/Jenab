<text x="1353.0" y="213.0" font-size="12" fill="#2b2b2b">When the target chat's turn ends, Mother</text>
<text x="1353.0" y="229.0" font-size="12" fill="#2b2b2b">gets the finish notice and passes on what</text>
<text x="1353.0" y="245.0" font-size="12" fill="#2b2b2b">matters in its own words.</text>
<circle cx="1335.0" cy="264.0" r="10" fill="#d9480f"/>
<text x="1335.0" y="268.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">5</text>
<text x="1353.0" y="268.0" font-size="12" fill="#2b2b2b">The user can jump to the chat that did</text>
<text x="1353.0" y="284.0" font-size="12" fill="#2b2b2b">the work.</text>
<circle cx="1335.0" cy="303.0" r="10" fill="#d9480f"/>
