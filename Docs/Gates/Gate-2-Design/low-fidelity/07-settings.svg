<circle cx="1335.0" cy="147.0" r="10" fill="#d9480f"/>
<text x="1335.0" y="151.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">2</text>
<text x="1353.0" y="151.0" font-size="12" fill="#2b2b2b">Providers: keys live in the keychain; the</text>
<text x="1353.0" y="167.0" font-size="12" fill="#2b2b2b">file only says a key exists. Adding a key</text>
<text x="1353.0" y="183.0" font-size="12" fill="#2b2b2b">turns on the catalog models it can use</text>
<text x="1353.0" y="199.0" font-size="12" fill="#2b2b2b">(SPEC 3.9).</text>
<circle cx="1335.0" cy="218.0" r="10" fill="#d9480f"/>
<text x="1335.0" y="222.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">3</text>
<text x="1353.0" y="222.0" font-size="12" fill="#2b2b2b">Default and fast models, set from the</text>
<text x="1353.0" y="238.0" font-size="12" fill="#2b2b2b">catalog with the first provider. The</text>
<text x="1353.0" y="254.0" font-size="12" fill="#2b2b2b">model list is built in and updated with</text>
<text x="1353.0" y="270.0" font-size="12" fill="#2b2b2b">the app.</text>
<circle cx="1335.0" cy="289.0" r="10" fill="#d9480f"/>
