<text x="318.0" y="481.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">6</text>
<circle cx="1050.0" cy="160.0" r="10" fill="#d9480f"/>
<text x="1050.0" y="164.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">7</text>
<circle cx="290.0" cy="810.0" r="10" fill="#d9480f"/>
<text x="290.0" y="814.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">8</text>
<circle cx="640.0" cy="848.0" r="10" fill="#d9480f"/>
<text x="640.0" y="852.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">9</text>
<circle cx="318.0" cy="561.0" r="10" fill="#d9480f"/>
<text x="318.0" y="565.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">10</text>
<text x="1325.0" y="72.0" font-size="14" fill="#2b2b2b" font-weight="600">Notes</text>
<circle cx="1335.0" cy="92.0" r="10" fill="#d9480f"/>
<text x="1335.0" y="96.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">1</text>
<text x="1353.0" y="96.0" font-size="12" fill="#2b2b2b">Rail, always shown: one tile per project,</text>
<text x="1353.0" y="112.0" font-size="12" fill="#2b2b2b">New project, Search, and Waiting with the</text>
<text x="1353.0" y="128.0" font-size="12" fill="#2b2b2b">approvals and questions from every</text>
<text x="1353.0" y="144.0" font-size="12" fill="#2b2b2b">project. Schedules and Settings sit at</text>
<text x="1353.0" y="160.0" font-size="12" fill="#2b2b2b">the bottom (SPEC 5.12).</text>
<circle cx="1335.0" cy="179.0" r="10" fill="#d9480f"/>
<text x="1335.0" y="183.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">2</text>
<text x="1353.0" y="183.0" font-size="12" fill="#2b2b2b">Mother is pinned at the top. It can't be</text>
<text x="1353.0" y="199.0" font-size="12" fill="#2b2b2b">archived, only cleared.</text>
<circle cx="1335.0" cy="218.0" r="10" fill="#d9480f"/>
<text x="1335.0" y="222.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">3</text>
<text x="1353.0" y="222.0" font-size="12" fill="#2b2b2b">Each chat shows its role or last</text>
<text x="1353.0" y="238.0" font-size="12" fill="#2b2b2b">activity, and a status: working (●) or</text>
<text x="1353.0" y="254.0" font-size="12" fill="#2b2b2b">waiting for you (!).</text>
<circle cx="1335.0" cy="273.0" r="10" fill="#d9480f"/>
<text x="1335.0" y="277.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">4</text>
<text x="1353.0" y="277.0" font-size="12" fill="#2b2b2b">Tool calls are one-line chips. Click one</text>
<text x="1353.0" y="293.0" font-size="12" fill="#2b2b2b">to see its arguments, a result preview</text>
<text x="1353.0" y="309.0" font-size="12" fill="#2b2b2b">and the time.</text>
<circle cx="1335.0" cy="328.0" r="10" fill="#d9480f"/>
<text x="1335.0" y="332.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">5</text>
<text x="1353.0" y="332.0" font-size="12" fill="#2b2b2b">Memory edits show a chip with undo and</text>
<text x="1353.0" y="348.0" font-size="12" fill="#2b2b2b">edit (SPEC 3.3). Refresh memory in the</text>
<text x="1353.0" y="364.0" font-size="12" fill="#2b2b2b">header updates memory and a summary in</text>
<text x="1353.0" y="380.0" font-size="12" fill="#2b2b2b">the session notes, then shortens the</text>
<text x="1353.0" y="396.0" font-size="12" fill="#2b2b2b">history (SPEC 3.5).</text>
<circle cx="1335.0" cy="415.0" r="10" fill="#d9480f"/>
<text x="1335.0" y="419.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">6</text>
<text x="1353.0" y="419.0" font-size="12" fill="#2b2b2b">Every turn ends with Undo turn.</text>
<circle cx="1335.0" cy="438.0" r="10" fill="#d9480f"/>
<text x="1335.0" y="442.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">7</text>
<text x="1353.0" y="442.0" font-size="12" fill="#2b2b2b">Right sidebar: Pages, Pipelines, Files,</text>
<text x="1353.0" y="458.0" font-size="12" fill="#2b2b2b">Links (SPEC 5.9, 6.10).</text>
<circle cx="1335.0" cy="477.0" r="10" fill="#d9480f"/>
<text x="1335.0" y="481.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">8</text>
<text x="1353.0" y="481.0" font-size="12" fill="#2b2b2b">Composer: the model picker for this chat</text>
<text x="1353.0" y="497.0" font-size="12" fill="#2b2b2b">(SPEC 3.9) and the approval level:</text>
<text x="1353.0" y="513.0" font-size="12" fill="#2b2b2b">Strict, Standard or Auto (SPEC 8.8).</text>
<circle cx="1335.0" cy="532.0" r="10" fill="#d9480f"/>
<text x="1335.0" y="536.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">9</text>
<text x="1353.0" y="536.0" font-size="12" fill="#2b2b2b">Bottom bar: this project's work, commands</text>
<text x="1353.0" y="552.0" font-size="12" fill="#2b2b2b">and pipelines; the chat's model and</text>
<text x="1353.0" y="568.0" font-size="12" fill="#2b2b2b">context use, and memory. Provider</text>
<text x="1353.0" y="584.0" font-size="12" fill="#2b2b2b">problems show while they last. Click an</text>
<text x="1353.0" y="600.0" font-size="12" fill="#2b2b2b">item to open it. No CPU, no tabs.</text>
<circle cx="1335.0" cy="619.0" r="10" fill="#d9480f"/>
