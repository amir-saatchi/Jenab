<text x="252.0" y="316.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">3</text>
<circle cx="318.0" cy="268.0" r="10" fill="#d9480f"/>
<text x="318.0" y="272.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">4</text>
<circle cx="318.0" cy="452.0" r="10" fill="#d9480f"/>
