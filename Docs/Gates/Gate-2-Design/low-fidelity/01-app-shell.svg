<text x="575.2" y="187.0" font-size="12" fill="#2b2b2b">Track Bitcoin every day: the price and the news that moves it.</text>
<text x="575.2" y="204.0" font-size="12" fill="#2b2b2b">And what was the price a year ago?</text>
<text x="330.0" y="240.0" font-size="12.5" fill="#2b2b2b">A year ago Bitcoin was about $58,900 (29 Sep 2025). I'll set up the daily tracking now.</text>
