<circle cx="252.0" cy="822.0" r="10" fill="#d9480f"/>
<text x="252.0" y="826.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">9</text>
<circle cx="318.0" cy="561.0" r="10" fill="#d9480f"/>
<text x="318.0" y="565.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">10</text>
<text x="1325.0" y="72.0" font-size="14" fill="#2b2b2b" font-weight="600">Notes</text>
<circle cx="1335.0" cy="92.0" r="10" fill="#d9480f"/>
<text x="1335.0" y="96.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">1</text>
<text x="1353.0" y="96.0" font-size="12" fill="#2b2b2b">Project switcher. Each project is one</text>
<text x="1353.0" y="112.0" font-size="12" fill="#2b2b2b">folder.</text>
<circle cx="1335.0" cy="131.0" r="10" fill="#d9480f"/>
<text x="1335.0" y="135.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">2</text>
<text x="1353.0" y="135.0" font-size="12" fill="#2b2b2b">Mother is pinned at the top. It can't be</text>
<text x="1353.0" y="151.0" font-size="12" fill="#2b2b2b">archived, only cleared.</text>
<circle cx="1335.0" cy="170.0" r="10" fill="#d9480f"/>
<text x="1335.0" y="174.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">3</text>
<text x="1353.0" y="174.0" font-size="12" fill="#2b2b2b">Each chat shows its role or last</text>
<text x="1353.0" y="190.0" font-size="12" fill="#2b2b2b">activity, and a status: working (●) or</text>
<text x="1353.0" y="206.0" font-size="12" fill="#2b2b2b">waiting for you (!).</text>
<circle cx="1335.0" cy="225.0" r="10" fill="#d9480f"/>
<text x="1335.0" y="229.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">4</text>
<text x="1353.0" y="229.0" font-size="12" fill="#2b2b2b">Tool calls are one-line chips. Click one</text>
<text x="1353.0" y="245.0" font-size="12" fill="#2b2b2b">to see its arguments, a result preview</text>
<text x="1353.0" y="261.0" font-size="12" fill="#2b2b2b">and the time.</text>
<circle cx="1335.0" cy="280.0" r="10" fill="#d9480f"/>
<text x="1335.0" y="284.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">5</text>
<text x="1353.0" y="284.0" font-size="12" fill="#2b2b2b">Memory edits show a chip with undo and</text>
<text x="1353.0" y="300.0" font-size="12" fill="#2b2b2b">edit (SPEC 3.3). Refresh memory in the</text>
<text x="1353.0" y="316.0" font-size="12" fill="#2b2b2b">header updates memory and a summary in</text>
<text x="1353.0" y="332.0" font-size="12" fill="#2b2b2b">the session notes, then shortens the</text>
<text x="1353.0" y="348.0" font-size="12" fill="#2b2b2b">history (SPEC 3.5).</text>
<circle cx="1335.0" cy="367.0" r="10" fill="#d9480f"/>
<text x="1335.0" y="371.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">6</text>
<text x="1353.0" y="371.0" font-size="12" fill="#2b2b2b">Every turn ends with Undo turn.</text>
<circle cx="1335.0" cy="390.0" r="10" fill="#d9480f"/>
<text x="1335.0" y="394.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">7</text>
<text x="1353.0" y="394.0" font-size="12" fill="#2b2b2b">Right sidebar: Pages, Pipelines, Files,</text>
<text x="1353.0" y="410.0" font-size="12" fill="#2b2b2b">Links (SPEC 5.9, 6.10).</text>
<circle cx="1335.0" cy="429.0" r="10" fill="#d9480f"/>
<text x="1335.0" y="433.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">8</text>
<text x="1353.0" y="433.0" font-size="12" fill="#2b2b2b">Composer: the model picker for this chat</text>
<text x="1353.0" y="449.0" font-size="12" fill="#2b2b2b">(SPEC 3.9) and the approval level:</text>
<text x="1353.0" y="465.0" font-size="12" fill="#2b2b2b">Strict, Standard or Auto (SPEC 8.8).</text>
<circle cx="1335.0" cy="484.0" r="10" fill="#d9480f"/>
<text x="1335.0" y="488.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">9</text>
<text x="1353.0" y="488.0" font-size="12" fill="#2b2b2b">Settings, and whether schedules keep</text>
<text x="1353.0" y="504.0" font-size="12" fill="#2b2b2b">running in the tray.</text>
<circle cx="1335.0" cy="523.0" r="10" fill="#d9480f"/>
<text x="1335.0" y="527.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">10</text>
<text x="1353.0" y="527.0" font-size="12" fill="#2b2b2b">While a turn runs, Send becomes Stop, and</text>
<text x="1353.0" y="543.0" font-size="12" fill="#2b2b2b">a new message joins the running turn.</text>
<text x="1325.0" y="576.0" font-size="14" fill="#2b2b2b" font-weight="600">Open questions</text>
<circle cx="1335" cy="596" r="10" fill="#fff" stroke="#d9480f" stroke-width="1.5"/>
<text x="1335.0" y="600.0" font-size="11" fill="#d9480f" font-weight="600" text-anchor="middle">?</text>
<text x="1353.0" y="600.0" font-size="12" fill="#2b2b2b">SPEC 8.6 gives Mother its own colour. Is</text>
<text x="1353.0" y="616.0" font-size="12" fill="#2b2b2b">the pin and the ◆ enough, or a colour as</text>
<text x="1353.0" y="632.0" font-size="12" fill="#2b2b2b">well?</text>
<circle cx="1335" cy="651" r="10" fill="#fff" stroke="#d9480f" stroke-width="1.5"/>
<text x="1335.0" y="655.0" font-size="11" fill="#d9480f" font-weight="600" text-anchor="middle">?</text>
<text x="1353.0" y="655.0" font-size="12" fill="#2b2b2b">Other projects: a dropdown (shown), or a</text>
<text x="1353.0" y="671.0" font-size="12" fill="#2b2b2b">projects screen?</text>
<text x="1325.0" y="704.0" font-size="14" fill="#2b2b2b" font-weight="600">Requirements</text>
<text x="1325.0" y="724.0" font-size="12" fill="#767676">R-10, R-11, R-12, R-14, R-16, R-24, R-26,</text>
<text x="1325.0" y="740.0" font-size="12" fill="#767676">R-46, R-72, R-117, R-121</text>
