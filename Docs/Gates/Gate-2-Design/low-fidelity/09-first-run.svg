<rect x="620.0" y="464.0" width="290.0" height="26.0" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
<text x="628.0" y="481.3" font-size="12" fill="#2b2b2b">••••••••••••••</text>
