<text x="961.0" y="481.3" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">Connect</text>
<text x="620.0" y="518.0" font-size="11" fill="#767676">Stored in the OS keychain · also in Settings → Models</text>
