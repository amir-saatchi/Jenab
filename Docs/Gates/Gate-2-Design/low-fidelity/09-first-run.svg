<text x="604.0" y="126.0" font-size="15" fill="#2b2b2b" font-weight="600">◆ Mother</text>
<text x="604.0" y="144.0" font-size="11" fill="#767676">Project home</text>
<line x1="580.0" y1="156.0" x2="1060.0" y2="156.0" stroke="#d9d9d9" stroke-width="1"/>
<text x="604.0" y="188.0" font-size="12" fill="#2b2b2b">Hi, I'm Mother, the home of this project. Tell me what to track,</text>
<text x="604.0" y="205.0" font-size="12" fill="#2b2b2b">and I'll set up the tables, a pipeline and a page.</text>
<rect x="604.0" y="220.0" width="168.8" height="24.0" rx="12.0" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
<text x="617.0" y="236.1" font-size="11.5" fill="#2b2b2b">Track a price every day</text>
<rect x="780.8" y="220.0" width="156.4" height="24.0" rx="12.0" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
<text x="793.8" y="236.1" font-size="11.5" fill="#2b2b2b">Summarise a news feed</text>
<rect x="737.8" y="260.0" width="298.2" height="48.0" rx="10" fill="#e6e6e6" stroke="none" stroke-width="1"/>
<text x="750.8" y="281.0" font-size="12" fill="#2b2b2b">Track Bitcoin every day: the price and the</text>
<text x="750.8" y="298.0" font-size="12" fill="#2b2b2b">news.</text>
<rect x="604.0" y="322.0" width="432.0" height="214.0" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1"/>
<text x="620.0" y="348.0" font-size="13" fill="#2b2b2b" font-weight="600">Mother needs an AI model to answer</text>
<text x="620.0" y="370.0" font-size="11.5" fill="#767676">Add a provider with your own key. Your message is kept and sent</text>
<text x="620.0" y="386.0" font-size="11.5" fill="#767676">once it is connected.</text>
<rect x="620.0" y="408.0" width="59.3" height="24.0" rx="4" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1"/>
<text x="649.6" y="424.1" font-size="11.5" fill="#ffffff" font-weight="600" text-anchor="middle">OpenAI</text>
