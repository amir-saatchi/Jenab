<text x="335.0" y="382.0" font-size="11" fill="#767676" text-anchor="middle">Change in Settings</text>
<rect x="196.0" y="428.0" width="278.0" height="132.0" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1"/>
<text x="212.0" y="454.0" font-size="13" fill="#2b2b2b" font-weight="600">New project</text>
