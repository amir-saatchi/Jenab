<text x="1164.0" y="126.0" font-size="15" fill="#2b2b2b" font-weight="600">◆ Mother</text>
<text x="1164.0" y="144.0" font-size="11" fill="#767676">Project home</text>
<line x1="1140.0" y1="156.0" x2="1620.0" y2="156.0" stroke="#d9d9d9" stroke-width="1"/>
<rect x="1297.8" y="176.0" width="298.2" height="48.0" rx="10" fill="#e6e6e6" stroke="none" stroke-width="1"/>
<text x="1310.8" y="197.0" font-size="12" fill="#2b2b2b">Track Bitcoin every day: the price and the</text>
<text x="1310.8" y="214.0" font-size="12" fill="#2b2b2b">news.</text>
<rect x="1164.0" y="238.0" width="237.1" height="24.0" rx="12.0" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
<text x="1177.0" y="254.1" font-size="11.5" fill="#2b2b2b">✓  OpenAI connected · 12 models on</text>
<text x="1164.0" y="288.0" font-size="12.5" fill="#2b2b2b">I'll set it up: a table for prices and news, a pipeline every</text>
<text x="1164.0" y="306.0" font-size="12.5" fill="#2b2b2b">day at 08:00, and a page.</text>
<rect x="1164.0" y="324.0" width="372.0" height="6.0" rx="3" fill="#d9d9d9" stroke="none" stroke-width="1"/>
<rect x="1164.0" y="337.0" width="204.6" height="6.0" rx="3" fill="#d9d9d9" stroke="none" stroke-width="1"/>
<rect x="1180.0" y="372.0" width="270.0" height="200.0" rx="6" fill="#ffffff" stroke="#2b2b2b" stroke-width="1"/>
<text x="1194.0" y="394.0" font-size="11" fill="#2b2b2b" font-weight="600">OpenAI</text>
<text x="1194.0" y="420.0" font-size="11.5" fill="#2b2b2b">✓ model-a · default</text>
<text x="1194.0" y="446.0" font-size="11.5" fill="#2b2b2b">   model-b · fast</text>
<text x="1194.0" y="472.0" font-size="11.5" fill="#2b2b2b">   model-c</text>
<text x="1194.0" y="498.0" font-size="11" fill="#767676" font-weight="600">Anthropic · Add key</text>
<text x="1194.0" y="524.0" font-size="11" fill="#767676" font-weight="600">Gemini · Add key</text>
<text x="1194.0" y="550.0" font-size="11" fill="#767676" font-weight="600">Ollama · not running</text>
<rect x="1152.0" y="578.0" width="456.0" height="76.0" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1"/>
<text x="1166.0" y="602.0" font-size="12.5" fill="#767676">Message Mother…</text>
<text x="1166.0" y="638.0" font-size="16" fill="#2b2b2b">+</text>
<rect x="1186.0" y="620.0" width="121.0" height="22.0" rx="11.0" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
<text x="1199.0" y="635.0" font-size="11" fill="#2b2b2b">Model: model-a ▾</text>
<rect x="1524.0" y="620.0" width="72.0" height="24.0" rx="4" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1"/>
<text x="1560.0" y="636.3" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">Send ↑</text>
<circle cx="246.0" cy="327.0" r="10" fill="#d9480f"/>
<text x="246.0" y="331.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">1</text>
<circle cx="196.0" cy="442.0" r="10" fill="#d9480f"/>
<text x="196.0" y="446.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">2</text>
<circle cx="594.0" cy="248.0" r="10" fill="#d9480f"/>
<text x="594.0" y="252.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">3</text>
<circle cx="594.0" cy="360.0" r="10" fill="#d9480f"/>
<text x="594.0" y="364.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">4</text>
<circle cx="594.0" cy="538.0" r="10" fill="#d9480f"/>
<text x="594.0" y="542.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">5</text>
<circle cx="1154.0" cy="232.0" r="10" fill="#d9480f"/>
<text x="1154.0" y="236.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">6</text>
<circle cx="1170.0" cy="386.0" r="10" fill="#d9480f"/>
<text x="1170.0" y="390.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">7</text>
<text x="20.0" y="720.0" font-size="14" fill="#2b2b2b" font-weight="600">Notes</text>
<circle cx="30.0" cy="740.0" r="10" fill="#d9480f"/>
<text x="30.0" y="744.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">1</text>
<text x="48.0" y="744.0" font-size="12" fill="#2b2b2b">The app opens straight into the main window. The data folder defaults to ~/Jenab; it can be changed in Settings,</text>
<text x="48.0" y="760.0" font-size="12" fill="#2b2b2b">with the cloud-sync warning if needed.</text>
<circle cx="30.0" cy="779.0" r="10" fill="#d9480f"/>
<text x="30.0" y="783.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">2</text>
<text x="48.0" y="783.0" font-size="12" fill="#2b2b2b">Creating a project asks only for a name, then opens its Mother chat.</text>
<circle cx="30.0" cy="802.0" r="10" fill="#d9480f"/>
<text x="30.0" y="806.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">3</text>
<text x="48.0" y="806.0" font-size="12" fill="#2b2b2b">Starter prompts fill the composer; nothing is sent until the user sends it.</text>
<circle cx="30.0" cy="825.0" r="10" fill="#d9480f"/>
<text x="30.0" y="829.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">4</text>
<text x="48.0" y="829.0" font-size="12" fill="#2b2b2b">Sending a message without a provider keeps the message and shows this card in the chat.</text>
<circle cx="30.0" cy="848.0" r="10" fill="#d9480f"/>
<text x="30.0" y="852.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">5</text>
<text x="48.0" y="852.0" font-size="12" fill="#2b2b2b">Connect stores the key in the keychain and checks which catalog models it can use.</text>
<circle cx="30.0" cy="871.0" r="10" fill="#d9480f"/>
<text x="30.0" y="875.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">6</text>
<text x="48.0" y="875.0" font-size="12" fill="#2b2b2b">Those models turn on in the model picker, and the kept message is sent.</text>
<circle cx="30.0" cy="894.0" r="10" fill="#d9480f"/>
<text x="30.0" y="898.0" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">7</text>
<text x="48.0" y="898.0" font-size="12" fill="#2b2b2b">Model picker: models from the built-in catalog, grouped by provider. New models arrive with app updates.</text>
<text x="30.0" y="921.0" font-size="12" fill="#2b2b2b" text-anchor="middle">•</text>
<text x="48.0" y="921.0" font-size="12" fill="#2b2b2b">Asked later, when needed: web search when a search is first needed; start at login when the first scheduled</text>
<text x="48.0" y="937.0" font-size="12" fill="#2b2b2b">pipeline is saved.</text>
<text x="840.0" y="720.0" font-size="14" fill="#2b2b2b" font-weight="600">Open questions</text>
<circle cx="850" cy="740" r="10" fill="#fff" stroke="#d9480f" stroke-width="1.5"/>
<text x="850.0" y="744.0" font-size="11" fill="#d9480f" font-weight="600" text-anchor="middle">?</text>
<text x="868.0" y="744.0" font-size="12" fill="#2b2b2b">Offer Ollama first when it is running on this machine?</text>
<circle cx="850" cy="763" r="10" fill="#fff" stroke="#d9480f" stroke-width="1.5"/>
<text x="850.0" y="767.0" font-size="11" fill="#d9480f" font-weight="600" text-anchor="middle">?</text>
<text x="868.0" y="767.0" font-size="12" fill="#2b2b2b">Offer the Bitcoin example as a ready project next to Create project (the Phase 5 "done when")?</text>
<circle cx="850" cy="786" r="10" fill="#fff" stroke="#d9480f" stroke-width="1.5"/>
<text x="850.0" y="790.0" font-size="11" fill="#d9480f" font-weight="600" text-anchor="middle">?</text>
<text x="868.0" y="790.0" font-size="12" fill="#2b2b2b">Show models the provider lists but the catalog doesn't know yet, under "Other models"?</text>
<text x="840.0" y="827.0" font-size="14" fill="#2b2b2b" font-weight="600">Requirements</text>
<text x="840.0" y="847.0" font-size="12" fill="#767676">R-02, R-04, R-90, R-91, R-118, R-119</text>
<rect x="840.0" y="863.0" width="30.0" height="16.0" rx="3" fill="#ffffff" stroke="#2b2b2b" stroke-width="1" stroke-dasharray="4 3"/>
<text x="880.0" y="875.0" font-size="11" fill="#767676">= proposed here, not in the SPEC yet</text>
</svg>
