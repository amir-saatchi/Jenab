<text x="36.0" y="646.0" font-size="12" fill="#2b2b2b">⚙  Settings</text>
<text x="335.0" y="248.0" font-size="20" fill="#2b2b2b" font-weight="600" text-anchor="middle">Welcome to Jenab</text>
<text x="335.0" y="276.0" font-size="12" fill="#767676" text-anchor="middle">Each project is one folder with its</text>
<text x="335.0" y="293.0" font-size="12" fill="#767676" text-anchor="middle">data, chats and files.</text>
